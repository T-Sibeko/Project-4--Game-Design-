<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width,initial-scale=1.0">

    <title>Let the games begin!</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="game-container">
        <header class="game-header">
        <div class="trophy-icon">🏆</div>
        <h1>Let The Games<br> Begin</h1>
        <div class="trophy-icon">🏆</div>
        </header>

        <section class="scoreboard">
            <div class="player">
                <h2>You</h2>
                <div id="playerScore"
                class="score">0</div>
            </div>

            <div class="versus">
                ⚡ VS ⚡
            </div>

            <div class="player">
            <h2>ACE</h2>

            <div id="opponentScore" class="score">
                0
            </div>
        </div>
        </section>

        <section class="hands">
            <div class="hand-section">
                <div class="hand-container">
                    <img id="playerHand" src="start-image-1.png" alt="Player hand">
                </div>
            </div>

            <div class="result-section">
                <h2 id="resultText">Whats Your Next Move?</h2>
                <p id="reasonText">Choose Rock, Paper or Scissors</p>
            </div>

            <div class="hand-section">
                <div class="hand-container">
                    <img id="opponentHand" src="start-image-2.png" alt="Computer hand">
                </div>
            </div>
        </section>

        <section class="choices">
            <h2>🔓Lock In...</h2>
            <div class="choice-buttons">
                <button class="choice" id="rockButton" type="button">
                <img src="rock.png" alt="Rock">
                <span> Rock</span></button>

                <button class="choice" id="paperButton" type="button">
                    <img src="paper.png" alt="Paper">
                    <span>Paper</span></button>

                <button class="choice" id="scissorsButton" type="button">
                    <img src="scissors.png" alt="Scissors">
                    <span>Scissors</span></button>
        
            </div>
        </section>

        <button id="resetButton" class="reset-button" type="button">Rematch?</button>
    </main>

    <audio id="clickSound" src="click.mp3"></audio>
    <audio id="winSound" src="win.mp3"></audio>
    <audio id="loseSound" src="lose.mp3"></audio>
    <audio id="drawSound" src="draw.mp3"></audio>

    <script src="script.js"></script>

</body>
</html>
